<!doctype html>
<!--
=============================================================================
docs/site-template.html — the DESIGN of your website.            [opt] PHASE 5
=============================================================================
You edit THIS file for layout/colors. You DON'T edit docs/index.html; that's
generated by Scripts/build-site.mjs, which fills the {{TOKENS}} below from:

  ship.config                  DISPLAY_NAME, SUPPORT_EMAIL, APP_STORE_URL,
                               DOWNLOAD_URL, SITE_ACCENT, GITHUB_USER
  store/metadata/<locale>.md   subtitle, promotional_text, description
  store/screenshots/<locale>/  the first device folder's PNGs

So the store listing and the website never drift apart: change the store
text, push, and .github/workflows/pages.yml rebuilds + publishes the site.

Tokens: {{DISPLAY_NAME}} {{SUBTITLE}} {{PROMO}} {{DESCRIPTION_HTML}}
        {{SCREENSHOTS_HTML}} {{CTA_HTML}} {{ICON_HTML}} {{SUPPORT_HTML}} {{REPO_URL}}
        {{ACCENT}} {{YEAR}}
=============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DISPLAY_NAME}} — {{SUBTITLE}}</title>
  <meta name="description" content="{{PROMO}}">
  <meta property="og:title" content="{{DISPLAY_NAME}}">
  <meta property="og:description" content="{{PROMO}}">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="icon" href="assets/icon-512.png">
  <style>
    :root { --bg: #0b0d1a; --panel: #151a30; --fg: #eef0ff; --muted: #9aa0c3; --accent: {{ACCENT}}; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 980px; margin: 0 auto; padding: 64px 20px 40px; }
    header { text-align: center; }
    .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
    h1 { font-size: clamp(36px, 7vw, 56px); margin: 18px 0 6px; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); font-size: 21px; margin: 0 0 14px; }
    .promo { max-width: 620px; margin: 0 auto 28px; }
    .cta { display: inline-block; margin: 4px; padding: 13px 24px; border-radius: 12px; background: var(--accent); color: #000; font-weight: 700; text-decoration: none; }
    .cta.secondary { background: transparent; color: var(--fg); border: 1px solid #333a5c; }
    .shots { display: flex; gap: 18px; overflow-x: auto; padding: 36px 4px 12px; scroll-snap-type: x mandatory; }
    .shots img { height: 460px; width: auto; border-radius: 18px; scroll-snap-align: center; background: var(--panel); flex: 0 0 auto; }
    .shots.wide img { height: 340px; }
    section.about { max-width: 680px; margin: 40px auto 0; }
    section.about ul { padding-left: 20px; } section.about li { margin: 6px 0; }
    footer { max-width: 680px; margin: 56px auto 0; padding-top: 20px; border-top: 1px solid #22284a; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }
    @media (max-width: 600px) { .shots img { height: 380px; } .shots.wide img { height: 200px; } }
  </style>
</head>
<body>
<main>
  <header>
    {{ICON_HTML}}
    <h1>{{DISPLAY_NAME}}</h1>
    <p class="tagline">{{SUBTITLE}}</p>
    <p class="promo">{{PROMO}}</p>
    {{CTA_HTML}}
  </header>

  {{SCREENSHOTS_HTML}}

  <section class="about">
    {{DESCRIPTION_HTML}}
  </section>

  <footer id="support">
    {{SUPPORT_HTML}}
    <p><a href="privacy.html">Privacy Policy</a> · <a href="{{REPO_URL}}">GitHub</a> · © {{YEAR}} {{DISPLAY_NAME}}</p>
  </footer>
</main>
</body>
</html>
