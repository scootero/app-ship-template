# =============================================================================
# release-mac.yml — signed + notarized DMG on GitHub Releases.  [mac] PHASE 5
# =============================================================================
# ONLY for Mac apps you also give out outside the App Store (like Blip's direct
# download + Homebrew). Deleted by bootstrap.sh for iOS-only apps. Delete it by
# hand if your Mac app is App-Store-only.
#
# Started by cut-release.yml. Needs these secrets:
#   DEVELOPER_ID_P12          base64 of your exported "Developer ID Application" .p12
#                             (base64 -i cert.p12 | pbcopy)
#   DEVELOPER_ID_P12_PASSWORD the password you set when exporting it
#   ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8   (same as apple-store.yml)
# =============================================================================
name: Release (Mac DMG)

on:
  workflow_dispatch: {}

permissions:
  contents: write   # create the GitHub Release

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "::error::DEVELOPER_ID_P12 secret missing"; exit 1; }
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Save notary credentials
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo "$ASC_API_KEY_P8" > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials notary \
            --key "$RUNNER_TEMP/key.p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID"

      - name: Build, sign, notarize
        run: |
          brew install xcodegen
          ./Scripts/build-dmg.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" --generate-notes
          # OPTIONAL: update Casks/app.rb's version here so Homebrew picks it up.
